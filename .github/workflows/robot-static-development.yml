name: Robot static resolution development
on:
  push:
    branches: [feat/robot-framework]
    paths: [.github/workflows/robot-static-development.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm install --save yaml@^2.8.1 saxes@^6.0.0
      - name: Collect released reference implementation
        run: |
          python -m pip install --target /tmp/robot-stable robotframework==7.4.2
          tar -czf /tmp/robot-static-inputs.tar.gz package.json package-lock.json node_modules/yaml node_modules/saxes node_modules/xmlchars -C /tmp robot-stable
      - uses: actions/upload-artifact@v4
        with:
          name: robot-static-inputs
          path: /tmp/robot-static-inputs.tar.gz
          retention-days: 2
